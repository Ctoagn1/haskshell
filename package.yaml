
name: haskshell
version: 0.1.0.0
license: BSD3

dependencies:
  - base >= 4.19 && < 5
  - process
  - directory
  - filepath
  - unix
  - containers

executables:
  codecrafters-shell-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
